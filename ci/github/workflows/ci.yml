# Copy to .github/workflows/ci.yml in the repository.
#
# Runs on every push and pull request, on CPU only:
#   1. the package (and any single-file build) compiles and its NAME strings have no apostrophes
#   1b. no undefined names (pyflakes; compileall cannot catch them)
#   2. secret scan of the whole repository
#   3. tests for the deployment scripts (readout extraction on real log excerpts)
#   4. package structure tests (imports, run-time links, the single-file export) on CPU torch
name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile builds and check NAME strings
        run: |
          shopt -s nullglob
          python -m compileall -q platypus
          for f in platypus/presets.py platypus/__main__.py threshold_lean_stagec9_7*_conduit.py; do
            python -m py_compile "$f"
            python - "$f" <<'PY'
          import ast, sys
          t = ast.parse(open(sys.argv[1], encoding="utf-8").read())
          bad = [n.lineno for n in ast.walk(t) if isinstance(n, ast.Assign)
                 and any(isinstance(x, ast.Name) and x.id in ("NAME", "BUILD_NAME", "BASE_NAME") for x in n.targets)
                 and isinstance(n.value, ast.Constant) and isinstance(n.value.value, str) and "'" in n.value.value]
          sys.exit(f"{sys.argv[1]}: apostrophe in NAME at {bad}" if bad else 0)
          PY
          done

      - name: Undefined names (pyflakes, minus each module's _LATE names)
        run: |
          pip install pyflakes
          python scripts/check_undefined.py platypus

      - name: Secret scan
        run: python scripts/scan_secrets.py .

      - name: CPU torch for the package tests
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy

      - name: Tests (deployment scripts and package structure)
        run: python -m unittest discover -s tests -v

